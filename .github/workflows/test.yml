name: test
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - reopened
    - synchronize

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }}.gemfile, PG ${{ matrix.postgres }}${{ matrix.pg_duckdb && ' +pg_duckdb' || '' }}
    runs-on: ubuntu-latest
    services:
      test-postgres:
        # Plain-Postgres rows use the stock image; pg_duckdb rows override
        # `image` with a pgduckdb build (Postgres + pg_duckdb preloaded via
        # shared_preload_libraries). The setup migration auto-creates the
        # extension when it's available, so no other per-row config is needed.
        image: ${{ matrix.image || format('postgres:{0}', matrix.postgres) }}
        ports:
        - 5432:5432
        env:
          POSTGRES_PASSWORD: foobar123
    strategy:
      matrix:
        include:
        # very old
        - { gemfile: 'rails_7.1', ruby: '3.3', postgres: '15' }
        # old
        - { gemfile: 'rails_7.2', ruby: '3.3', postgres: '16' }
        - { gemfile: 'rails_7.2', ruby: '3.3', postgres: '17' }
        # current
        - { gemfile: 'rails_8.0', ruby: '3.4', postgres: '17' }
        - { gemfile: 'rails_8.0', ruby: '3.4', postgres: '18' }
        # futuristic
        - { gemfile: 'rails_8.1', ruby: 'head', postgres: '17', experimental: true }
        - { gemfile: 'rails_8.1', ruby: 'head', postgres: '18', experimental: true }
        - { gemfile: 'rails_head', ruby: 'head', postgres: '18', experimental: true }
        # pg_duckdb — same suite against a pgduckdb build. PG16/17 are pinned
        # to 17-v1.0.0, the image data-odyssey runs in production; PG18 uses
        # 1.1.0, the earliest build with PG18 support (there is no 18-v1.0.0).
        # The extension is created by the dummy-app setup migration when detected.
        - { gemfile: 'rails_7.2', ruby: '3.3', postgres: '16', image: 'pgduckdb/pgduckdb:16-v1.0.0', pg_duckdb: true }
        - { gemfile: 'rails_7.2', ruby: '3.3', postgres: '17', image: 'pgduckdb/pgduckdb:17-v1.0.0', pg_duckdb: true }
        - { gemfile: 'rails_8.0', ruby: '3.4', postgres: '17', image: 'pgduckdb/pgduckdb:17-v1.0.0', pg_duckdb: true }
        - { gemfile: 'rails_8.0', ruby: '3.4', postgres: '18', image: 'pgduckdb/pgduckdb:18-v1.1.0', pg_duckdb: true }
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v6
    - name: Setup ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
      env:
        BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    - name: Create database
      run: |
        createdb \
          --host=$POSTGRES_HOST \
          --port=$POSTGRES_PORT \
          --username=postgres \
          dummy
      env:
        PGPASSWORD: foobar123
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
    - name: Run specs
      run:
        bundle exec rake install_database_yml spec && bundle exec rake testing_spec
      env:
        BACKTRACE: 1
        BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
        DB: postgres
        IRONTRAIL_CI_DATABASE: dummy
        IRONTRAIL_CI_DB_USER: postgres
        IRONTRAIL_CI_DB_PASSWORD: foobar123
        IRONTRAIL_CI_DB_HOST: 127.0.0.1
        IRONTRAIL_CI_DB_PORT: 5432
